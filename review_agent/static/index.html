<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Review Agent 工作台</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151d35;--line:#2b385c;--text:#edf2ff;--muted:#9eaccb;--accent:#6ea8fe;--bad:#ff8092;--ok:#63d7ae}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--text)}header{padding:24px max(24px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}header p{color:var(--muted);margin:7px 0 0}.layout{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:260px 1fr;gap:24px}aside,section{background:var(--card);border:1px solid var(--line);border-radius:12px}aside{padding:12px;height:max-content}.session{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--text);padding:10px;cursor:pointer}.session:hover,.session.active{background:#26365e}main{display:grid;gap:18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,section{padding:16px}.metric b{font-size:26px;display:block;margin-top:5px}.label{color:var(--muted);font-size:12px}h2{font-size:16px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#27385f}.critical,.high{color:var(--bad)}.completed{color:var(--ok)}.empty{color:var(--muted);padding:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}aside{max-height:180px;overflow:auto}}
  </style>
</head>
<body><header><h1>Review Agent · 审计工作台</h1><p>只读呈现 runs 中的可追溯审查结果；默认仅绑定本机。</p></header><div class="layout"><aside><div class="label">审查会话</div><div id="sessions" class="empty">正在加载…</div></aside><main id="content"><div class="empty">选择一个审查会话</div></main></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(url)=>fetch(url).then(r=>r.ok?r.json():Promise.reject());
function table(headers, rows){return `<table><thead><tr>${headers.map(esc).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="99" class="empty">暂无数据</td></tr>'}</tbody></table>`}
function render(d){const f=d.findings||[],m=d.metrics||{}, task=d.tasks||[], ev=d.events||[]; $('#content').innerHTML=`<div class="summary"><div class="metric"><span class="label">Findings</span><b>${f.length}</b></div><div class="metric"><span class="label">任务数</span><b>${task.length}</b></div><div class="metric"><span class="label">有效证据率</span><b>${m.evidenceValidity?.rate==null?'—':Math.round(m.evidenceValidity.rate*100)+'%'}</b></div><div class="metric"><span class="label">会话耗时</span><b>${m.durationsMs?.session??'—'}<small> ms</small></b></div></div><section><h2>发现的问题</h2>${table(['严重度','维度','位置','标题','证据'],f.map(x=>`<tr><td class="${esc(x.severity)}">${esc(x.severity)}</td><td>${esc(x.dimension)}</td><td>${esc(x.file)}:${esc(x.line)}</td><td>${esc(x.title)}</td><td>${(x.evidenceRefs||[]).length}</td></tr>`).join(''))}</section><section><h2>任务图</h2>${table(['任务','维度','状态','目标'],task.map(x=>`<tr><td>${esc(x.taskId)}</td><td>${esc(x.dimension)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.goal)}</td></tr>`).join(''))}</section><section><h2>审计时间线</h2>${table(['序号','角色','事件','摘要'],ev.map(x=>`<tr><td>${esc(x.seq)}</td><td>${esc(x.role)}</td><td><span class="pill">${esc(x.eventType)}</span></td><td>${esc(x.summary)}</td></tr>`).join(''))}</section>`}
async function load(){try{const sessions=await get('/api/sessions'); $('#sessions').innerHTML=sessions.length?sessions.map((s,i)=>`<button class="session ${i?'':'active'}" data-id="${esc(s.id)}">${esc(s.id)}</button>`).join(''):'<div class="empty">尚无审查会话<br>请先运行 CLI。</div>'; document.querySelectorAll('.session').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.session').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(await get('/api/sessions/'+encodeURIComponent(b.dataset.id)))});if(sessions[0])render(await get('/api/sessions/'+encodeURIComponent(sessions[0].id)))}catch{$('#sessions').textContent='无法加载审查会话';}}
load();
</script><div style="position:fixed;right:18px;bottom:18px;background:#151d35;border:1px solid #2b385c;border-radius:10px;padding:12px;max-width:420px"><details><summary>新建审查</summary><form id="newReview" style="display:grid;gap:6px;margin-top:8px"><input name="repo" required placeholder="仓库绝对路径，例如 D:\\repo"><input name="scope" placeholder="范围，例如 src,api"><input name="goal" required placeholder="审查目标"><button>开始（fake 离线模式）</button></form></details><details style="margin-top:10px"><summary>新增 RAG 规则</summary><form id="newRule" style="display:grid;gap:6px;margin-top:8px"><input name="ruleId" required placeholder="唯一 ID，例如 TEAM-AUTH-001"><input name="title" required placeholder="规则标题"><input name="languages" required placeholder="语言，例如 python,typescript"><select name="category"><option>security</option><option>performance</option><option>logic</option></select><select name="severity"><option>medium</option><option>high</option><option>critical</option><option>low</option></select><textarea name="text" required placeholder="规则正文：风险、触发条件、检查或修复建议"></textarea><button>保存并索引</button></form></details><div id="job" style="margin-top:8px;color:#9eaccb"></div></div><script>
const post=(u,d)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.error);return x});
function runJob(j){let out=document.querySelector('#job');out.textContent=j.message;let t=setInterval(async()=>{let x=await post('/api/jobs/'+j.id,{});out.textContent=x.message;if(x.status!=='running'){clearInterval(t);if(x.sessionId)load()}},800)}
function form(id,url){document.querySelector(id).onsubmit=async e=>{e.preventDefault();try{runJob(await post(url,Object.fromEntries(new FormData(e.target))))}catch(x){document.querySelector('#job').textContent=x.message}}};form('#newReview','/api/reviews');form('#newRule','/api/rules');
</script><script>document.querySelector('#newReview').insertAdjacentHTML('afterend','<form id="uploadReview" style="display:grid;gap:6px;margin-top:8px"><b>上传文件审查</b><input name="files" type="file" multiple required><input name="goal" required placeholder="审查目标"><button>上传并开始审查</button><small>多个源码文件总计不超过 5 MB，不支持 ZIP。</small></form>');document.querySelector('#uploadReview').onsubmit=async e=>{e.preventDefault();let files=[];for(let x of e.target.files.files){let c=await new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(x)});files.push({name:x.name,content:c})}try{runJob(await post('/api/reviews/upload',{files,goal:e.target.goal.value}))}catch(x){document.querySelector('#job').textContent=x.message}};</script></body></html>
